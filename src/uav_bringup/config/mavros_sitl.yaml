# MAVROS SITL configuration overlay for PX4 UDP simulation.
# This file is intentionally small and separate from real hardware configs.

conn:
  heartbeat_rate: 1.0
  timeout: 10.0
  timesync_rate: 10.0
  system_time_rate: 1.0

time:
  time_ref_source: "fcu"
  timesync_mode: MAVLINK
  timesync_avg_alpha: 0.6

local_position:
  frame_id: "map"
  tf:
    send: false
    frame_id: "map"
    child_frame_id: "base_link"
    send_fcu: false

imu:
  frame_id: "base_link"

setpoint_position:
  mav_frame: LOCAL_NED

setpoint_velocity:
  mav_frame: LOCAL_NED
